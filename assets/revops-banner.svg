<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b19" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0a0f24" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .bg-grid { stroke: rgba(255, 255, 255, 0.04); stroke-width: 1; }
      .ambient-pulse { animation: pulse 6s ease-in-out infinite alternate; }
      .chart-wave { animation: dash 12s linear infinite; }
      .float-badge { animation: float 5s ease-in-out infinite alternate; }
      .float-badge-delayed { animation: float 6s ease-in-out 1.5s infinite alternate; }

      @keyframes pulse {
        0% { opacity: 0.25; transform: scale(0.98); }
        100% { opacity: 0.6; transform: scale(1.02); }
      }
      @keyframes float {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-10px); }
      }
      @keyframes dash {
        to { stroke-dashoffset: -1000; }
      }
      
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 52px;
        fill: #ffffff;
        letter-spacing: -1px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 20px;
        fill: #94a3b8;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #e2e8f0;
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Background Decorative Grid Lines -->
  <g class="bg-grid">
    <line x1="100" y1="0" x2="100" y2="420" />
    <line x1="250" y1="0" x2="250" y2="420" />
    <line x1="400" y1="0" x2="400" y2="420" />
    <line x1="550" y1="0" x2="550" y2="420" />
    <line x1="700" y1="0" x2="700" y2="420" />
    <line x1="850" y1="0" x2="850" y2="420" />
    <line x1="1000" y1="0" x2="1000" y2="420" />
    <line x1="1150" y1="0" x2="1150" y2="420" />
    
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="0" y1="400" x2="1200" y2="400" />
  </g>

  <!-- Ambient Glowing Orbs in the background -->
  <circle cx="200" cy="120" r="140" fill="url(#glowGrad)" class="ambient-pulse" />
  <circle cx="1020" cy="220" r="160" fill="url(#glowGrad)" class="ambient-pulse" style="animation-delay: -3s;" />

  <!-- Animated Revenue Pipeline Wave Graph in lower background -->
  <g opacity="0.45">
    <!-- Area under curve -->
    <path d="M 0 380 Q 200 320, 380 340 T 750 270 T 1050 200 T 1200 170 L 1200 420 L 0 420 Z" fill="url(#chartGrad)" />
    <!-- Wave line -->
    <path d="M 0 380 Q 200 320, 380 340 T 750 270 T 1050 200 T 1200 170" 
          fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="10 6" class="chart-wave" />
    <!-- Secondary trend wave -->
    <path d="M 0 395 Q 250 350, 480 365 T 820 300 T 1200 230" 
          fill="none" stroke="#a855f7" stroke-width="2.5" opacity="0.7" />
  </g>

  <!-- Decorative dynamic floating RevOps tags in background-corners -->
  <g class="float-badge" opacity="0.85">
    <rect x="880" y="55" width="230" height="42" rx="21" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="905" cy="76" r="6" fill="#38bdf8" />
    <text x="922" y="81" class="badge-text">📈 Revenue Intelligence</text>
  </g>

  <g class="float-badge-delayed" opacity="0.85">
    <rect x="850" y="325" width="260" height="42" rx="21" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" />
    <circle cx="875" cy="346" r="6" fill="#818cf8" />
    <text x="892" y="351" class="badge-text">🎯 Pipeline &amp; Quota Forecasting</text>
  </g>

  <g class="float-badge" opacity="0.85">
    <rect x="70" y="325" width="230" height="42" rx="21" fill="#1e293b" stroke="#c084fc" stroke-width="1.5" />
    <circle cx="95" cy="346" r="6" fill="#c084fc" />
    <text x="112" y="351" class="badge-text">⚡ CRM &amp; GTM Data Engine</text>
  </g>

  <!-- FOREGROUND: Header Content (crisp, high-contrast, immune to background animation) -->
  <g transform="translate(100, 115)">
    <!-- Pill Tag -->
    <rect x="0" y="0" width="220" height="32" rx="16" fill="rgba(56, 189, 248, 0.12)" stroke="#38bdf8" stroke-width="1.2" />
    <text x="18" y="21" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12" letter-spacing="1.5">CURATED REVOPS DIRECTORY</text>

    <!-- Main Title -->
    <text x="0" y="85" class="title-text">
      Awesome <tspan fill="url(#accentGrad)">RevOps</tspan> Platform
    </text>

    <!-- Subtitle -->
    <text x="0" y="125" class="subtitle-text">
      A curated collection of Revenue Operations, intelligence platforms,
    </text>
    <text x="0" y="153" class="subtitle-text">
      forecasting engines, and open-source GTM data architectures.
    </text>

    <!-- Highlights Row -->
    <g transform="translate(0, 195)">
      <rect x="0" y="0" width="135" height="28" rx="6" fill="#1e293b" />
      <text x="15" y="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#94a3b8">📊 Forecasting</text>

      <rect x="145" y="0" width="145" height="28" rx="6" fill="#1e293b" />
      <text x="160" y="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#94a3b8">🤖 AI Intelligence</text>

      <rect x="300" y="0" width="140" height="28" rx="6" fill="#1e293b" />
      <text x="315" y="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#94a3b8">🔄 Data Sync &amp; CPQ</text>

      <rect x="450" y="0" width="145" height="28" rx="6" fill="#1e293b" />
      <text x="465" y="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#94a3b8">💻 Open Source</text>
    </g>
  </g>
</svg>
