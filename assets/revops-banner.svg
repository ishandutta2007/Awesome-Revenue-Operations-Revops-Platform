<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 420"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#070b19"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#0a0f24"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="glowGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#38bdf8" stop-opacity=".2"/><stop offset="100%" stop-color="#a855f7" stop-opacity="0"/></linearGradient><linearGradient id="chartGrad" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#38bdf8" stop-opacity=".3"/><stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/></linearGradient><filter id="subtleGlow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><style>@keyframes pulse{0%{opacity:.25;transform:scale(.98)}}@keyframes float{0%{transform:translateY(0)}}.bg-grid{stroke:rgba(255,255,255,.04);stroke-width:1}.ambient-pulse{animation:pulse 6s ease-in-out infinite alternate}.chart-wave{animation:dash 12s linear infinite}.float-badge{animation:float 5s ease-in-out infinite alternate}.float-badge-delayed{animation:float 6s ease-in-out 1.5s infinite alternate}.badge-text,.subtitle-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title-text{font-weight:800;font-size:52px;fill:#fff;letter-spacing:-1px}.subtitle-text{font-weight:400;font-size:20px;fill:#94a3b8}.badge-text{font-weight:600;font-size:13px;fill:#e2e8f0}</style></defs><rect width="1200" height="420" fill="url(#bgGrad)" rx="16"/><g class="bg-grid"><line x1="100" x2="100" y1="0" y2="420"/><line x1="250" x2="250" y1="0" y2="4